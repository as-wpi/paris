[project]
name = "paris-analytics"
version = "0.6.0"
description = "PARIS — Portfolio Analytics, Risk & Investment Statistics: performance statistics for fund returns, absolute and relative to a benchmark."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "DISCLAIMER.md"]
authors = [{ name = "Ekam Dev", email = "ekam@aqubelabs.com" }]
keywords = [
  "portfolio", "finance", "risk", "performance", "sharpe", "sortino",
  "drawdown", "returns", "benchmark", "quant", "attribution",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.23", "pandas>=2.2"]

[project.urls]
Homepage = "https://github.com/ekam-a3/paris"
Repository = "https://github.com/ekam-a3/paris"
Issues = "https://github.com/ekam-a3/paris/issues"
Changelog = "https://github.com/ekam-a3/paris/blob/main/CHANGELOG.md"

[project.optional-dependencies]
scipy = ["scipy>=1.9"]
polars = ["polars>=0.20", "pyarrow>=12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src/paris", "LICENSE", "DISCLAIMER.md", "README.md", "CHANGELOG.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/paris"]

[dependency-groups]
dev = ["pytest>=8"]
oracle = [
    "jumpmodels>=0.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
